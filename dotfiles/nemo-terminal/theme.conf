# Nemo Terminal color scheme.
#
# source can be:
#   auto    - Kitty config if it defines colors, then Ghostty, then GTK theme
#   kitty   - ~/.config/kitty/kitty.conf (including its includes)
#   ghostty - ~/.config/ghostty/config or config.ghostty
#   gtk     - colors from the current GTK theme
#   custom  - the file below
source = auto

# Kitty or Ghostty style theme file, used when source = custom.
# file = ~/.config/kitty/themes/noctalia.conf
