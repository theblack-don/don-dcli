# Generated by Noctalia — do not edit manually
# Felix (fx) colors, kept in sync with the active Noctalia palette.

# Default exec command when opening file.
# If not set, will default to $EDITOR.
default: hx

# Foreground colors of directory, file and symlink.
# Values come from the active Noctalia palette (Material You roles).
color:
  dir_fg: !Rgb [{{colors.primary.default.rgb_csv}}]
  file_fg: !Rgb [{{colors.on_surface.default.rgb_csv}}]
  symlink_fg: !Rgb [{{colors.tertiary.default.rgb_csv}}]
  dirty_fg: !Rgb [{{colors.error.default.rgb_csv}}]
