[extensions/nemo-terminal]
terminal-hotkey='<Alt>x'
terminal-position='bottom'
terminal-shell='/usr/bin/fish'

[icon-view]
default-zoom-level='standard'

[plugins]
disabled-actions=['set-resolution.nemo_action', 'change-background.nemo_action', 'add-desklets.nemo_action', 'set-as-background.nemo_action']
disabled-extensions=@as []

[preferences]
disable-menu-warning=true
quick-renames-with-pause-in-between=true
show-compact-view-icon-toolbar=false
show-home-icon-toolbar=true
show-location-entry=true
show-open-in-terminal-toolbar=true
show-toggle-extra-pane-toolbar=true

[preferences/menu-config]
selection-menu-copy-to=true
selection-menu-move-to=true

